# Game image: runs from RAM $4000-$7FFF (copied there by the loader).
MEMORY {
    ZP:   start = $0080, size = $0080, type = rw;
    RAM:  start = $0B80, size = $0080, type = rw, file = "";
    RAM2: start = $1B00, size = $0100, type = rw, file = "";
    IMG:  start = $4000, size = $3D80, type = rw, fill = yes, fillval = $FF, file = %O;
    IMGI: start = $7D80, size = $027D, type = rw, fill = yes, fillval = $FF, file = %O;
    ENT:  start = $7FFD, size = $0003, type = rw, file = %O;
    IMGB: start = $8000, size = $3780, type = rw, fill = yes, fillval = $FF, file = "imgb.bin";
    IMGBI: start = $B780, size = $0080, type = rw, fill = yes, fillval = $FF, file = "imgb.bin";
    RAM3: start = $B800, size = $0180, type = rw, file = "";
    RAM5: start = $BA00, size = $0010, type = rw, file = "";
    BANR: start = $BB90, size = $0070, type = rw, file = "";
    R08:  start = $08A0, size = $0060, type = rw, file = "";
    R09:  start = $09A0, size = $0060, type = rw, file = "";
    R0A:  start = $0AB0, size = $0050, type = rw, file = "";
    RD1:  start = $2A80, size = $0080, type = rw, file = "";
    RD2:  start = $2B80, size = $0080, type = rw, file = "";
    RC1:  start = $1D28, size = $0058, type = rw, file = "";
    RC2:  start = $1BCA, size = $0036, type = rw, file = "";
    RC3:  start = $0BDE, size = $0022, type = rw, file = "";
    RC4:  start = $3BDD, size = $0023, type = rw, file = "";
    OVLM: start = $1000, size = $0B00, type = rw, fill = yes, fillval = $FF, file = "ovl.bin";
    OVLX: start = $8B00, size = $1500, type = rw, file = "ovl.bin";
    RA:   start = $7D80, size = $027D, type = rw, file = "";
    RCM:  start = $3F80, size = $0080, type = rw, file = "";
    RT0M: start = $1D51, size = $002F, type = rw, file = "";
    RT1M: start = $B980, size = $0080, type = rw, file = "";
    RT2M: start = $0100, size = $0078, type = rw, file = "";
    RT3M: start = $0178, size = $0054, type = rw, file = "";
    CWAM: start = $05C8, size = $0038, type = rw, file = "";
    CWBM: start = $06C8, size = $0038, type = rw, file = "";
    CWCM: start = $07C8, size = $0038, type = rw, file = "";
    PKFM: start = $0BE5, size = $001B, type = rw, file = "";
    PKM1M: start = $2BE5, size = $001B, type = rw, file = "";
    PKM2M: start = $3FEF, size = $0011, type = rw, file = "";
    MSNDM: start = $0340, size = $0080, type = rw, file = "";
    ZRFM: start = $03B6, size = $0032, type = rw, file = "";
    ZMUM: start = $04F0, size = $0010, type = rw, file = "";
    RBB:  start = $B780, size = $0080, type = rw, file = "";
    P4:   start = $0400, size = $0100, type = rw, file = "";
    TRKM: start = $8000, size = $1000, type = rw, fill = yes, fillval = $FF, file = "tracks.bin";
    OSCM: start = $C000, size = $1000, type = rw, fill = yes, fillval = $FF, file = "osr.bin";
    OSDM: start = $D800, size = $0800, type = rw, fill = yes, fillval = $FF, file = "osr.bin";
    OSEM: start = $E400, size = $1200, type = rw, fill = yes, fillval = $FF, file = "osr.bin";
    OSPM: start = $F600, size = $0600, type = rw, fill = yes, fillval = $FF, file = "osr.bin";
    OSFM: start = $FC00, size = $03FA, type = rw, fill = yes, fillval = $FF, file = "osr.bin";
    OSVM: start = $FFFA, size = $0006, type = rw, fill = yes, fillval = $FF, file = "osr.bin";
    OVL2M: start = $1000, size = $0B00, type = rw, fill = yes, fillval = $FF, file = "ovl2.bin";
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    BSS:      load = RAM, type = bss;
    BSS2:     load = RAM2, type = bss;
    TABLES:   load = IMG, type = rw, align = $100;
    CODE:     load = IMG, type = rw;
    RODATA:   load = IMG, type = rw;
    INITA:    load = IMGI, type = rw;
    ENTRY:    load = ENT, type = rw;
    CODE2:    load = IMGB, type = rw;
    RODATA2:  load = IMGB, type = rw, optional = yes;
    INITB:    load = IMGBI, type = rw;
    BSS3:     load = RAM3, type = bss, optional = yes;
    BSS5:     load = RAM5, type = bss;
    OVL:      load = OVLM, type = rw;
    OVLBAN:   load = OVLM, run = BANR, type = rw, define = yes;
    OVLB2:    load = OVLM, run = R08, type = rw, define = yes;
    OVLB3:    load = OVLM, run = R09, type = rw, define = yes;
    OVLB4:    load = OVLM, run = R0A, type = rw, define = yes;
    OVLD1:    load = OVLM, run = RD1, type = rw, define = yes;
    OVLD2:    load = OVLM, run = RD2, type = rw, define = yes;
    OVLC1:    load = OVLM, run = RC1, type = rw, define = yes;
    OVLC2:    load = OVLM, run = RC2, type = rw, define = yes;
    OVLC3:    load = OVLM, run = RC3, type = rw, define = yes;
    OVLC4:    load = OVLM, run = RC4, type = rw, define = yes;
    RC:       load = OVLX, run = RCM, type = rw, define = yes;
    OVLBOT:   load = OVLM, type = rw, start = $1A00;
    RA1:      load = OVLX, run = RA, type = rw, define = yes;
    RA2:      load = OVLX, run = RA, type = rw, define = yes;
    RA3:      load = OVLX, run = RA, type = rw, define = yes;
    RT0:      load = OVLX, run = RT0M, type = rw, define = yes;
    RT1:      load = OVLX, run = RT1M, type = rw, define = yes;
    RT2:      load = OVLX, run = RT2M, type = rw, define = yes;
    RT3:      load = OVLX, run = RT3M, type = rw, define = yes;
    CWA:      load = OVLX, run = CWAM, type = rw, define = yes;
    CWB:      load = OVLX, run = CWBM, type = rw, define = yes;
    CWC:      load = OVLX, run = CWCM, type = rw, define = yes;
    PKF:      load = OVLX, run = PKFM, type = rw, define = yes;
    PKM1:     load = OVLX, run = PKM1M, type = rw, define = yes;
    PKM2:     load = OVLX, run = PKM2M, type = rw, define = yes;
    MSND:     load = OVLX, run = MSNDM, type = rw, define = yes;
    ZRF:      load = OVLX, run = ZRFM, type = rw, define = yes;
    ZMU:      load = OVLX, run = ZMUM, type = rw, define = yes;
    BSSR:     load = RBB, type = bss;
    BSS4:     load = P4, type = bss;
    TRACKS:   load = TRKM, type = rw;
    OVL2:     load = OVL2M, type = rw;
    OSC:      load = OSCM, type = rw, optional = yes;
    OSD:      load = OSDM, type = rw, optional = yes;
    OSE:      load = OSEM, type = rw;
    OSV:      load = OSVM, type = rw;
    OSP:      load = OSPM, type = rw;
    OSF:      load = OSFM, type = rw, optional = yes;
}
