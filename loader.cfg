# Fixed bank (bank 15) of the 128K switchable XEGS cartridge: $A000-$BFFF.
MEMORY {
    ZP:   start = $0080, size = $0010, type = rw;
    FIX:  start = $A000, size = $1FFA, type = ro, fill = yes, fillval = $FF, file = %O;
    HDR:  start = $BFFA, size = $0006, type = ro, fill = yes, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    CODE:     load = FIX, type = ro;
    CARTHDR:  load = HDR, type = ro;
}
